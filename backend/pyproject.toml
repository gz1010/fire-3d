[project]
name = "fire3d"
version = "0.1.0"
description = "Fire-3d backend: real-data 3D wildfire forensics & forecast for California"
requires-python = ">=3.12,<3.13"
dependencies = [
    # pyretechnics pins numpy~=1.26.2, scipy~=1.12.0, rasterio~=1.4.3 (sdist, compiled with Cython)
    "pyretechnics==2026.8.10",
    "numpy==1.26.4",
    "scipy>=1.12,<1.13",
    "rasterio>=1.4.3,<1.5",
    "shapely>=2",
    "pyproj>=3.6",
    "pandas>=2.2,<3",
    "pyarrow>=15,<26",  # pyarrow 26 requires numpy>=2
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "orjson>=3.10",
    "pillow>=10.1",
    "scikit-image>=0.24",
    "certifi",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fire3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
